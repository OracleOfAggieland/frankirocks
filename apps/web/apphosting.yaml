# Firebase App Hosting settings for the franki-web backend.
# https://firebase.google.com/docs/app-hosting/configure
runConfig:
  cpu: 1
  memoryMiB: 1024
  concurrency: 80
  minInstances: 0 # raise to 1 while judges are active (Dec 14 to Jan 29)
  maxInstances: 4

env:
  # Model IDs are config, not code, so a week-1 eval can swap them without a rebuild.
  - variable: FRANKI_VOICE_MODEL
    value: gpt-realtime-2.1
  - variable: FRANKI_BRAIN_MODEL
    value: gpt-6.1-terra
  - variable: FRANKI_ESCALATE_MODEL
    value: gpt-6.1-sol
  - variable: FRANKI_BG_MODEL
    value: gpt-6-luna
  - variable: FRANKI_EMBED_MODEL
    value: text-embedding-3-small
  - variable: FRANKI_TRANSCRIBE_MODEL
    value: gpt-4o-mini-transcribe
  # Text-to-speech for the judge spike's synthetic probe audio (brief 006). Not used by the app at runtime.
  - variable: FRANKI_TTS_MODEL
    value: gpt-4o-mini-tts

  # Not a secret. The Admin SDK is initialized with this project ID explicitly.
  - variable: FRANKI_FIREBASE_PROJECT_ID
    value: frankirocks

  # Public Firebase web config, needed in the browser bundle. These are identifiers, not secrets.
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: AIzaSyBQHHmkHtE1qXA-wIoFoHJUQf7J-UX0Tag
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: frankirocks.firebaseapp.com
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: frankirocks
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: 1:1072058223425:web:760293638ce18e2820afc0
    availability:
      - BUILD
      - RUNTIME

  # Secrets come from Secret Manager and exist only at runtime, never in the build.
  - variable: OPENAI_API_KEY
    secret: OPENAI_API_KEY
    availability:
      - RUNTIME
  - variable: SMOKE_TOKEN
    secret: SMOKE_TOKEN
    availability:
      - RUNTIME
  - variable: FRANKI_ID_HMAC_KEY
    secret: FRANKI_ID_HMAC_KEY
    availability:
      - RUNTIME
  - variable: TWILIO_AUTH_TOKEN
    secret: TWILIO_AUTH_TOKEN
    availability: [RUNTIME]
  - variable: OPENAI_WEBHOOK_SECRET
    secret: OPENAI_WEBHOOK_SECRET
    availability: [RUNTIME]

  - variable: FRANKI_PHONE_REPORT_ORIGIN
    value: https://frankirocks.com
    availability: [RUNTIME]

  # Keep account identifiers and the calling number in the deployment environment.
  - variable: TWILIO_ACCOUNT_SID
    secret: TWILIO_ACCOUNT_SID
    availability: [RUNTIME]
  - variable: TWILIO_PHONE_NUMBER
    secret: TWILIO_PHONE_NUMBER
    availability: [RUNTIME]
  - variable: OPENAI_PROJECT_ID
    secret: OPENAI_PROJECT_ID
    availability: [RUNTIME]

  # A connected bank, read-only (brief 046). PLAID_ENV is `production` or `sandbox`.
  - variable: PLAID_ENV
    value: production
  - variable: PLAID_CLIENT_ID
    secret: PLAID_CLIENT_ID
    availability: [RUNTIME]
  - variable: PLAID_SECRET
    secret: PLAID_SECRET
    availability: [RUNTIME]
  - variable: FRANKI_BANK_TOKEN_KEY
    secret: FRANKI_BANK_TOKEN_KEY
    availability: [RUNTIME]

  # A connected Google account, read-only (brief 049; setup in docs/setup.md). The OAuth client is
  # "Franki Gmail and Calendar" in the frankirocks project. With any of the three unset, every /api/google/* route
  # answers CONFIG and the sheet says Google isn't set up. The refresh token is sealed under FRANKI_BANK_TOKEN_KEY, above.
  #
  # The client ID is not a secret (it ends `.apps.googleusercontent.com`).
  - variable: GOOGLE_OAUTH_CLIENT_ID
    value: 1072058223425-gmi4nd49sopnhbfgbllfpmd3cvg914pv.apps.googleusercontent.com
  # The one redirect URI this deployment hands to Google (not a secret): the custom domain plus /google/callback.
  # Start refuses any request whose Origin doesn't match it exactly, so Google connects from https://frankirocks.com
  # only (www redirects there); on the hosted.app address the sheet can't start a connection.
  - variable: GOOGLE_OAUTH_REDIRECT_URI
    value: https://frankirocks.com/google/callback
  - variable: GOOGLE_OAUTH_CLIENT_SECRET
    secret: GOOGLE_OAUTH_CLIENT_SECRET
    availability: [RUNTIME]
