name: Secret scan

# Scans the whole history of every fetched branch on every push and pull request, independent of the build in
# ci.yml. There is no commit range: a commit that an earlier run missed (cancelled, failed early, or outside a
# range) is scanned by the next run on any branch.
on:
  push:
    branches: ["**"]
  pull_request:

# A newer push to a pull request cancels its older run. A push run that has started is never cancelled; one still
# waiting is replaced by a newer push to the same branch, whose run scans the same history and more.
concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  gitleaks:
    name: Full-history secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # The gitleaks CLI, pinned. The SHA-256 is the linux_x64 line of that release's gitleaks_<version>_checksums.txt.
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      # fetch-depth 0 fetches every branch and tag, so `git log --all` below sees all of them.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install gitleaks (pinned version and checksum)
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archive"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version

      # With no --log-opts, `gitleaks git` reads `git log -p --full-history --all`. Its "commits scanned" line is
      # compared with the counts printed first (`git log -p` shows no diff for a merge commit, so the two can differ
      # by the merges). A finding fails the job; it is looked at, never allow-listed to pass.
      - name: Scan every commit
        run: |
          echo "Commits reachable from any ref: $(git rev-list --count --all) ($(git rev-list --count --all --no-merges) without merges)"
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --verbose .
